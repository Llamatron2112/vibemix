name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Qt's link step needs a fast linker; .cargo/config.toml is local-only.
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  # Pinned so releases are reproducible (nfpm taps this, and it overrides the
  # `stable` channel in rust-toolchain.toml for the container builds).
  NFPM_VERSION: v2.47.0
  RUST_VERSION: "1.99.0"

jobs:
  # Gate: only publish packages from a commit that passes lint + tests.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config lld \
            qt6-base-dev qt6-declarative-dev \
            libx11-dev libgl-dev \
            lv2-dev liblilv-dev libserd-dev libsord-dev libsratom-dev libsuil-dev \
            libjack-jackd2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Oldest supported Debian: .deb + the raw binary tarball.
  linux:
    needs: check
    runs-on: ubuntu-24.04
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      # debian:12 ships no bash, so bootstrap it (and the fetch tools) with the
      # default `sh`; every later step runs under bash.
      - name: Install fetch tools
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash git ca-certificates curl

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config lld \
            libx11-dev libgl-dev \
            qt6-base-dev qt6-declarative-dev \
            lv2-dev liblilv-dev libserd-dev libsord-dev libsratom-dev libsuil-dev \
            libjack-jackd2-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=${RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Package (.deb + tarball)
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${NFPM_VERSION#v}"
          curl -sSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${v}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tar.gz nfpm

          export VIBEMIX_VERSION="${GITHUB_REF_NAME#v}"
          ./nfpm package -f packaging/nfpm.yaml -p deb -t dist/

          stage="vibemix-${VIBEMIX_VERSION}"
          rm -rf "$stage" && mkdir "$stage"
          cp target/release/vibemix-engine target/release/vibemix-gui "$stage/"
          cp packaging/vibemix packaging/vibemix.desktop packaging/vibemix.svg "$stage/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$stage/"
          tar -czf "dist/${stage}-x86_64-linux-gnu.tar.gz" "$stage"

      - name: Verify .deb
        run: |
          set -euo pipefail
          apt-get install -y ./dist/vibemix_*_amd64.deb
          vibemix-gui --version
          vibemix-engine --version
          if ldd /usr/bin/vibemix-gui | grep -q "not found"; then
            ldd /usr/bin/vibemix-gui
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # Oldest supported Fedora: .rpm.
  rpm:
    needs: check
    runs-on: ubuntu-24.04
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - name: Install fetch tools
        run: dnf install -y git ca-certificates curl tar

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc-c++ cmake ninja-build pkgconf-pkg-config lld \
            libX11-devel mesa-libGL-devel libglvnd-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            lv2-devel lilv-devel serd-devel sord-devel sratom-devel suil-devel \
            pipewire-jack-audio-connection-kit-devel

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=${RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Fedora's qmake6 is not on PATH.
          QMAKE: /usr/lib64/qt6/bin/qmake6
        run: |
          export PATH="/usr/lib64/qt6/bin:$PATH"
          cargo build --release --locked --workspace

      - name: Package (.rpm)
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${NFPM_VERSION#v}"
          curl -sSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${v}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tar.gz nfpm
          export VIBEMIX_VERSION="${GITHUB_REF_NAME#v}"
          ./nfpm package -f packaging/nfpm.yaml -p rpm -t dist/

      - name: Verify .rpm
        run: |
          set -euo pipefail
          dnf install -y ./dist/vibemix-*.rpm
          vibemix-gui --version
          vibemix-engine --version
          if ldd /usr/bin/vibemix-gui | grep -q "not found"; then
            ldd /usr/bin/vibemix-gui
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/*
          if-no-files-found: error

  release:
    needs: [linux, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/sha256sums.txt
