name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Qt's link step needs a fast linker; .cargo/config.toml is local-only.
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  # Pinned so releases are reproducible (nfpm taps this, and it overrides the
  # `stable` channel in rust-toolchain.toml for the container builds).
  NFPM_VERSION: v2.47.0
  RUST_VERSION: "1.99.0"

jobs:
  # Gate: only publish packages from a commit that passes lint + tests.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config lld zstd \
            qt6-base-dev qt6-declarative-dev \
            libx11-dev libgl-dev \
            lv2-dev liblilv-dev libserd-dev libsord-dev libsratom-dev libsuil-dev \
            libjack-jackd2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Release assets. Source0 is the tree with the VST3/CLAP submodules;
      # Source1 is the cargo vendor archive (COPR and OBS build offline).
      - name: Source tarball
        run: packaging/opensuse/make-source-tarball.sh

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Vendor tarball
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          packaging/opensuse/make-vendor-tarball.sh "$version"
          mv dist/vendor.tar.zst "dist/vendor-${version}.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: vendor
          path: dist/vendor-*.tar.zst
          if-no-files-found: error

  # One .deb per Debian release, built against that release's Qt (see the note
  # on the Qt version lock in packaging/nfpm.yaml).
  deb:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: debian:12
            suffix: deb12
            release: 1~deb12
          - container: debian:13
            suffix: deb13
            release: 1~deb13
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      # debian:12 ships no bash, so bootstrap it (and the fetch tools) with the
      # default `sh`; every later step runs under bash.
      - name: Install fetch tools
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash git ca-certificates curl

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config lld \
            libx11-dev libgl-dev \
            qt6-base-dev qt6-declarative-dev \
            lv2-dev liblilv-dev libserd-dev libsord-dev libsratom-dev libsuil-dev \
            libjack-jackd2-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=${RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Package (.deb)
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${NFPM_VERSION#v}"
          curl -sSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${v}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tar.gz nfpm

          # Find the package that owns each Qt6 library, by file rather than by
          # name (Debian 12 ships libqt6core6; Debian 13 ships libqt6core6t64).
          qt_owner() {
            local real out pkg
            real="$(readlink -f "/usr/lib/x86_64-linux-gnu/$1")"
            out="$(dpkg-query -S "$real" 2>/dev/null || true)"
            pkg="$(printf '%s\n' "$out" | awk -F: 'NR==1 { print $1 }')"
            if [ -z "$pkg" ]; then
              echo "error: no installed package owns $1" >&2
              exit 1
            fi
            echo "$pkg"
          }
          QT_CORE="$(qt_owner libQt6Core.so.6)"
          QT_GUI="$(qt_owner libQt6Gui.so.6)"
          QT_QML="$(qt_owner libQt6Qml.so.6)"
          QT_QUICK="$(qt_owner libQt6Quick.so.6)"
          export QT_CORE QT_GUI QT_QML QT_QUICK
          qtver="$(dpkg-query -W -f='${Version}' "$QT_CORE")"
          mm="$(echo "$qtver" | grep -oE '^[0-9]+\.[0-9]+')"
          major="${mm%%.*}"; minor="${mm##*.}"
          export VIBEMIX_VERSION="${GITHUB_REF_NAME#v}"
          export PKG_RELEASE="${{ matrix.release }}"
          export QT_MIN="$mm"
          export QT_MAX="${major}.$((minor + 1))"
          echo "Qt ${QT_MIN} -> ${QT_MAX}; core=$QT_CORE gui=$QT_GUI qml=$QT_QML quick=$QT_QUICK; release ${PKG_RELEASE}"
          ./nfpm package -f packaging/nfpm.yaml -p deb -t dist/

      - name: Verify .deb
        run: |
          set -euo pipefail
          apt-get install -y ./dist/vibemix_*_amd64.deb
          vibemix-gui --version
          vibemix-engine --version
          if ldd /usr/bin/vibemix-gui | grep -q "not found"; then
            ldd /usr/bin/vibemix-gui
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # GitHub stores "~" in asset names as "."; list the names as published.
          sha256sum *.deb *.tar.gz *.tar.zst | sed 's/~/./g' > sha256sums.txt
          cat sha256sums.txt

      - name: Release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" \
            '$0 ~ "^## \\[" v "\\]" { p=1; next } p && (/^## \[/ || /^\[[^]]*\]: /) { exit } p' \
            CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "vibemix ${version}" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.tar.zst
            dist/sha256sums.txt
