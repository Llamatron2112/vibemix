name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Qt's link step needs a fast linker; .cargo/config.toml is local-only.
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  # Pinned so releases are reproducible (nfpm taps this, and it overrides the
  # `stable` channel in rust-toolchain.toml for the container builds).
  NFPM_VERSION: v2.47.0
  RUST_VERSION: "1.99.0"

jobs:
  # Gate: only publish packages from a commit that passes lint + tests.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config lld \
            qt6-base-dev qt6-declarative-dev \
            libx11-dev libgl-dev \
            lv2-dev liblilv-dev libserd-dev libsord-dev libsratom-dev libsuil-dev \
            libjack-jackd2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # One .deb per Debian release, built against that release's Qt (see the note
  # on the Qt version lock in packaging/nfpm.yaml).
  deb:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: debian:12
            suffix: deb12
            release: 1~deb12
          - container: debian:13
            suffix: deb13
            release: 1~deb13
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      # debian:12 ships no bash, so bootstrap it (and the fetch tools) with the
      # default `sh`; every later step runs under bash.
      - name: Install fetch tools
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash git ca-certificates curl

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config lld \
            libx11-dev libgl-dev \
            qt6-base-dev qt6-declarative-dev \
            lv2-dev liblilv-dev libserd-dev libsord-dev libsratom-dev libsuil-dev \
            libjack-jackd2-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=${RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Package (.deb)
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${NFPM_VERSION#v}"
          curl -sSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${v}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tar.gz nfpm

          # Discover the distro's Qt6 library package names (Debian 12 ships
          # libqt6core6; Debian 13 ships libqt6core6t64) and Qt series.
          qt_pkg() { dpkg-query -W -f='${binary:Package}\n' "$1*" 2>/dev/null | head -1; }
          export QT_CORE="$(qt_pkg libqt6core6)"
          export QT_GUI="$(qt_pkg libqt6gui6)"
          export QT_QML="$(qt_pkg libqt6qml6)"
          export QT_QUICK="$(qt_pkg libqt6quick6)"
          qtver="$(dpkg-query -W -f='${Version}' "$QT_CORE")"
          mm="$(echo "$qtver" | grep -oE '^[0-9]+\.[0-9]+')"
          major="${mm%%.*}"; minor="${mm##*.}"
          export VIBEMIX_VERSION="${GITHUB_REF_NAME#v}"
          export PKG_RELEASE="${{ matrix.release }}"
          export QT_MIN="$mm"
          export QT_MAX="${major}.$((minor + 1))"
          echo "Qt ${QT_MIN} -> ${QT_MAX} (${QT_CORE}), release ${PKG_RELEASE}"
          ./nfpm package -f packaging/nfpm.yaml -p deb -t dist/

      - name: Verify .deb
        run: |
          set -euo pipefail
          apt-get install -y ./dist/vibemix_*_amd64.deb
          vibemix-gui --version
          vibemix-engine --version
          if ldd /usr/bin/vibemix-gui | grep -q "not found"; then
            ldd /usr/bin/vibemix-gui
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  # One .rpm per Fedora release, built against that release's Qt.
  rpm:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: fedora:43
            suffix: fc43
            release: 1.fc43
          - container: fedora:44
            suffix: fc44
            release: 1.fc44
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install fetch tools
        run: dnf install -y git ca-certificates curl tar

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc-c++ cmake ninja-build pkgconf-pkg-config lld \
            libX11-devel mesa-libGL-devel libglvnd-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            lv2-devel lilv-devel serd-devel sord-devel sratom-devel suil-devel \
            pipewire-jack-audio-connection-kit-devel

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=${RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Fedora's qmake6 is not on PATH.
          QMAKE: /usr/lib64/qt6/bin/qmake6
        run: |
          export PATH="/usr/lib64/qt6/bin:$PATH"
          cargo build --release --locked --workspace

      - name: Package (.rpm)
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${NFPM_VERSION#v}"
          curl -sSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${v}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tar.gz nfpm
          mm="$(rpm -q --qf '%{VERSION}' qt6-qtbase | grep -oE '^[0-9]+\.[0-9]+')"
          major="${mm%%.*}"; minor="${mm##*.}"
          export VIBEMIX_VERSION="${GITHUB_REF_NAME#v}"
          export PKG_RELEASE="${{ matrix.release }}"
          export QT_MIN="$mm"
          export QT_MAX="${major}.$((minor + 1))"
          echo "Qt ${QT_MIN} -> ${QT_MAX}, release ${PKG_RELEASE}"
          ./nfpm package -f packaging/nfpm.yaml -p rpm -t dist/

      - name: Verify .rpm
        run: |
          set -euo pipefail
          dnf install -y ./dist/vibemix-*.rpm
          vibemix-gui --version
          vibemix-engine --version
          if ldd /usr/bin/vibemix-gui | grep -q "not found"; then
            ldd /usr/bin/vibemix-gui
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.deb *.rpm > sha256sums.txt
          cat sha256sums.txt

      - name: Release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" \
            '$0 ~ "^## \\[" v "\\]" { p=1; next } p && (/^## \[/ || /^\[[^]]*\]: /) { exit } p' \
            CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "vibemix ${version}" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/sha256sums.txt
