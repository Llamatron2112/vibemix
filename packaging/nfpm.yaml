# nfpm packaging for the release workflow (https://nfpm.goreleaser.com).
#
# The release workflow runs this once per distro release, in that distro's
# container and against that distro's Qt:
#   cargo build --release --locked --workspace
#   nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#
# nfpm expands ${VAR} from the environment:
#   VIBEMIX_VERSION  the version (from the git tag)
#   PKG_RELEASE      the package release, distro-tagged (e.g. 1~deb12, 1.fc43)
#   QT_MIN, QT_MAX   the Qt series to require, derived from the build container
#   QT_CORE/QT_GUI/QT_QML/QT_QUICK  the distro's Qt6 library package names
#                    (Debian 12: libqt6core6; Debian 13: libqt6core6t64)
name: vibemix
arch: amd64
platform: linux
version: ${VIBEMIX_VERSION}
release: ${PKG_RELEASE}
section: sound
priority: optional
maintainer: "Llamatron2112 <llamatron23@proton.me>"
vendor: vibemix
homepage: https://github.com/Llamatron2112/vibemix
license: MIT OR Apache-2.0
description: |
  Modular LV2/VST3/CLAP audio mixer for JACK/PipeWire.
  A real-time audio engine (JACK/PipeWire) plus a Qt Quick control surface.
contents:
  - src: target/release/vibemix-engine
    dst: /usr/bin/vibemix-engine
    file_info:
      mode: 0755
  - src: target/release/vibemix-gui
    dst: /usr/bin/vibemix-gui
    file_info:
      mode: 0755
  - src: packaging/vibemix
    dst: /usr/bin/vibemix
    file_info:
      mode: 0755
  - src: packaging/vibemix.desktop
    dst: /usr/share/applications/vibemix.desktop
  - src: packaging/vibemix.svg
    dst: /usr/share/icons/hicolor/scalable/apps/vibemix.svg
  - src: LICENSE-MIT
    dst: /usr/share/licenses/vibemix/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/licenses/vibemix/LICENSE-APACHE

# Why the Qt floor *and* ceiling: cxx-qt compiles the QML ahead-of-time with
# qmlcachegen, whose output calls Qt *private* API. Qt tags those symbols with a
# version node for the Qt it was built against and does not carry them across
# minors, so the binary only runs against the same Qt minor it was built with.
# Hence a per-distro-release build pinned to that distro's Qt.
overrides:
  deb:
    depends:
      - libc6
      - libstdc++6
      - libx11-6
      - libgl1
      - liblilv-0-0
      - libsuil-0-0
      - libjack-jackd2-0 | pipewire-jack
      - ${QT_CORE} (>= ${QT_MIN})
      - ${QT_CORE} (<< ${QT_MAX})
      - ${QT_GUI} (>= ${QT_MIN})
      - ${QT_GUI} (<< ${QT_MAX})
      - ${QT_QML} (>= ${QT_MIN})
      - ${QT_QML} (<< ${QT_MAX})
      - ${QT_QUICK} (>= ${QT_MIN})
      - ${QT_QUICK} (<< ${QT_MAX})
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-dialogs
      - qml6-module-qtquick-window
    recommends:
      - libgtk-3-0
  rpm:
    depends:
      - glibc
      - libstdc++
      - libX11
      - libglvnd-glx
      - lilv
      - suil
      - pipewire-jack-audio-connection-kit
      - qt6-qtbase >= ${QT_MIN}
      - qt6-qtbase < ${QT_MAX}
      - qt6-qtdeclarative >= ${QT_MIN}
      - qt6-qtdeclarative < ${QT_MAX}
    recommends:
      - gtk3
